name: Test Monero LWS Dockerfile

on:
  pull_request:
    paths:
      - 'monero-lws/Dockerfile'
      - 'monero-lws/VERSION'
      - 'monero-lws/MONERO_VERSION'

jobs:
  monero-lws-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup VERSION and MONERO_VERSION
      run: |
          export VERSION=$(cat monero-lws/VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export MONERO_VERSION=$(cat monero-lws/MONERO_VERSION)
          echo "MONERO_VERSION=$MONERO_VERSION" >> $GITHUB_ENV

    - name: Docker build
      run: docker build --build-arg VERSION_ARG=${VERSION} --build-arg MONERO_VERSION_ARG=${MONERO_VERSION} $GITHUB_WORKSPACE/monero-lws
