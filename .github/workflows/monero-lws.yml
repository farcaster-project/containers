name: Monero LWS

on:
  push:
    branches: [ main ]
    paths:
      - 'monero-lws/Dockerfile'
      - 'monero-lws/VERSION'
      - 'monero-lws/MONERO_VERSION'

jobs:
  monero-lws:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup VERSION and MONERO_VERSION
      run: |
          export VERSION=$(cat monero-lws/VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          export MONERO_VERSION=$(cat monero-lws/MONERO_VERSION)
          echo "MONERO_VERSION=$MONERO_VERSION" >> $GITHUB_ENV

    - name: Docker build
      run: docker build --build-arg VERSION_ARG=${VERSION} --build-arg MONERO_VERSION_ARG=${MONERO_VERSION} -f $GITHUB_WORKSPACE/monero-lws/Dockerfile -t ghcr.io/farcaster-project/containers/monero-lws:${VERSION}-monero-${MONERO_VERSION} -t ghcr.io/farcaster-project/containers/monero-lws:latest $GITHUB_WORKSPACE/monero-lws

    - name: Docker push to GitHub Packages
      run:  |
          docker push ghcr.io/farcaster-project/containers/monero-lws:${VERSION}-monero-${MONERO_VERSION}
          docker push ghcr.io/farcaster-project/containers/monero-lws:latest
