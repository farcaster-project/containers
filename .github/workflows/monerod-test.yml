name: Test monerod Dockerfile

on:
  pull_request:
    paths:
      - 'monerod/Dockerfile'
      - 'monerod/SHASUM'
      - 'monerod/VERSION'

jobs:
  monerod-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup VERSION
      run: |
          export VERSION=$(cat monerod/VERSION)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

    - name: Docker build
      run: docker build --build-arg VRS=v${VERSION} $GITHUB_WORKSPACE/monerod
